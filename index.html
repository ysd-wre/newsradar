<body>
<header>
  <div class="kopf">
    <a class="marke" href="#"><span class="balken" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>NewsRadar</a>
    <label class="suche"><span class="nurvorlesen">Meldungen durchsuchen</span><input id="suche" type="search" placeholder="Suchen" autocomplete="off"></label>
    <button id="umschalten" class="rund" type="button" aria-label="Zwischen hell und dunkel wechseln" title="Hell oder dunkel"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="mond" d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/><g class="sonne"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></g></svg></button>
  </div>
  <nav id="ressorts" aria-label="Ressorts"></nav>
</header>
<aside id="appleiste" class="nuroffen" hidden>
  <p><b>NewsRadar als App</b><span>Kostenlos auf Handy und Computer</span></p>
  <button id="installieren" class="knopf voll laden" type="button">App herunterladen</button>
  <button id="kastenzu" class="rund" type="button" aria-label="Hinweis schließen">×</button>
</aside>
<main id="inhalt" tabindex="-1"><p class="leer">Meldungen werden geladen …</p></main>
<footer>
  <p id="stand" role="status"></p>
  <p class="nuroffen">Die Meldungen schreibt eine KI aus Schlagzeilen mehrerer Medien. Sie können Fehler enthalten.</p>
  <button id="installieren2" class="knopf nuroffen" type="button" hidden>App herunterladen</button>
  <button id="abmelden" class="knopf nuroffen" type="button">Abmelden</button>
</footer>
<dialog id="anleitung" aria-labelledby="anleitungtitel"></dialog>
<script src="app.js"></script>
